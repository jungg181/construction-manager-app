<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Site · Construction Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.onsite-head{background:#0f172a;color:#fff;padding:14px 16px;border-radius:0 0 16px 16px;text-align:center}
.onsite-head h1{margin:0;font-size:1.25rem}
.onsite-head p{margin:4px 0 0;color:#cbd5e1;font-size:.8rem}
.scan-btn{width:100%;padding:18px;font-size:1.15rem;font-weight:800;border-radius:14px;margin:10px 0}
#qr-reader{border-radius:12px;overflow:hidden}
#qr-reader video{border-radius:12px}
.confirm-card{border:2px solid var(--blue);border-radius:14px;padding:14px;margin:10px 0;background:#eff6ff}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:30px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:#16a34a}
.switch input:checked + .slider:before{transform:translateX(22px)}
.switch input:disabled + .slider{background:#e2e8f0;cursor:not-allowed}
.status-big{font-size:1.05rem;font-weight:700}
.tc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:.88rem}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}
.msg.info{background:#dbeafe;color:#1e40af}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="onsite-head">
  <h1>📍 On Site</h1>
  <p>Construction Manager · Worker App</p>
</div>

<main class="container narrow">
  <div id="flash"></div>

  <div class="card" style="margin-top:12px"><div class="card-body">
    <label><b>Who are you?</b>
      <select id="worker-select">
        <option value="">— Select your name —</option>
        {% for w in workers %}<option value="{{ w.id }}">{{ w.name }} ({{ w.trade }})</option>{% endfor %}
      </select>
    </label>
  </div></div>

  <div class="card" style="margin-top:10px"><div class="card-body" id="status-card">
    <div class="muted">Select your name to see your status.</div>
  </div></div>

  <button class="btn primary scan-btn" id="scan-btn" onclick="startScan()">📷 Scan QR</button>

  <div id="scanner-box" class="hidden">
    <div class="card"><div class="card-body">
      <div id="qr-reader"></div>
      <p class="muted small" id="scan-hint">Point your camera at the supervisor's QR code.</p>
      <button class="btn small" onclick="stopScan()">Cancel</button>
      <div style="margin-top:10px">
        <label class="small"><b>Or enter the code manually</b>
          <input type="text" id="manual-token" placeholder="Paste QR code text or token" style="width:100%">
        </label>
        <button class="btn small" style="margin-top:6px" onclick="useManualToken()">Use code</button>
      </div>
    </div></div>
  </div>

  <div id="confirm-box" class="confirm-card hidden">
    <h3 id="cf-title" style="margin-top:0"></h3>
    <p><b>Site:</b> <span id="cf-site"></span><br>
       <b>Worker:</b> <span id="cf-worker"></span></p>
    <p class="muted small" id="cf-geo">Getting your location...</p>
    <div class="row-actions">
      <button class="btn primary big" id="cf-confirm" onclick="confirmClock()">Confirm</button>
      <button class="btn big" onclick="cancelConfirm()">Cancel</button>
    </div>
  </div>

  <div class="card" style="margin-top:10px"><div class="card-body switch-row">
    <div><b>Share my live location</b><br>
      <span class="muted small" id="loc-hint">Sends your position every minute while clocked in.</span></div>
    <label class="switch"><input type="checkbox" id="loc-toggle" disabled><span class="slider"></span></label>
  </div></div>

  <div class="card" style="margin-top:10px"><div class="card-body">
    <h3 style="margin-top:0">My timecards <span class="muted small">(last 7 days)</span></h3>
    <div id="tc-list"><div class="muted">Select your name first.</div></div>
  </div></div>
</main>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const $ = id => document.getElementById(id);
const LS_KEY = 'onsite_worker_id';
let pendingToken = null, scanner = null, locTimer = null, curWorker = null;

function msg(html, kind){
  $('flash').innerHTML = `<div class="msg ${kind}">${html}</div>`;
  setTimeout(()=>{ $('flash').innerHTML=''; }, 6000);
}
function workerName(){
  const s = $('worker-select');
  return s.options[s.selectedIndex] ? s.options[s.selectedIndex].text : '';
}

function initWorker(){
  const saved = localStorage.getItem(LS_KEY);
  if (saved) $('worker-select').value = saved;
  curWorker = $('worker-select').value || null;
  if (curWorker) refreshAll();
}
$('worker-select').onchange = () => {
  stopLocSharing();
  curWorker = $('worker-select').value || null;
  localStorage.setItem(LS_KEY, curWorker || '');
  refreshAll();
};

async function refreshAll(){
  if (!curWorker) return;
  await refreshStatus();
  await refreshTimecards();
}

async function refreshStatus(){
  const r = await fetch('/api/worker-status/' + curWorker);
  if (!r.ok) return;
  const d = await r.json();
  const c = $('status-card');
  if (d.clocked_in) {
    c.innerHTML = `<div class="status-big">🟢 Clocked in</div>
      <div>${d.site_name} · since ${d.clock_in ? d.clock_in.slice(5,16).replace('T',' ') : ''}</div>
      <div class="muted small">Today: ${d.today_hours}h</div>`;
    $('loc-toggle').disabled = false;
  } else {
    c.innerHTML = `<div class="status-big">⚪ Not clocked in</div>
      <div class="muted small">Today: ${d.today_hours}h</div>`;
    $('loc-toggle').disabled = true;
    stopLocSharing();
  }
}

async function refreshTimecards(){
  const r = await fetch('/api/my-timecards/' + curWorker + '?days=7');
  if (!r.ok) return;
  const rows = await r.json();
  $('tc-list').innerHTML = rows.length ? rows.map(t =>
    `<div class="tc-row"><span><b>${t.date}</b> · ${t.site_name}<br>
     <span class="muted small">${t.clock_in}${t.clock_out ? ' – ' + t.clock_out : ' – on shift'} · ${t.status.replace('_',' ')}</span></span>
     <b>${t.hours}h</b></div>`).join('')
    : '<div class="muted">No timecards in the last 7 days.</div>';
}

/* ---------- QR scanning ---------- */
function extractToken(text){
  text = (text || '').trim();
  if (!text) return '';
  const m = text.match(/\/clock\/([A-Za-z0-9]+)/);
  if (m) return m[1];
  return text.split('/').pop().split('?')[0];
}

async function startScan(){
  if (!curWorker) { msg('Select your name first.', 'info'); return; }
  $('scanner-box').classList.remove('hidden');
  $('scan-btn').classList.add('hidden');
  try {
    scanner = new Html5Qrcode('qr-reader');
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}},
      onScan, ()=>{});
  } catch(e) {
    $('scan-hint').textContent = 'Camera unavailable (' + (e && e.message ? e.message : 'denied') + '). You can enter the code manually below.';
  }
}
async function stopScan(){
  try { if (scanner) { await scanner.stop(); await scanner.clear(); } } catch(e){}
  scanner = null;
  $('scanner-box').classList.add('hidden');
  $('scan-btn').classList.remove('hidden');
}
function onScan(text){
  const token = extractToken(text);
  if (!token) { msg('Could not read a code from that QR.', 'err'); return; }
  stopScan();
  prepareConfirm(token);
}
function useManualToken(){
  const token = extractToken($('manual-token').value);
  if (!token) { msg('Paste the QR code text first.', 'err'); return; }
  stopScan();
  prepareConfirm(token);
}

let pendingGeo = null;
async function prepareConfirm(token){
  const r = await fetch('/api/qr-info/' + encodeURIComponent(token));
  const d = await r.json();
  if (!r.ok || !d.ok) { msg(d.error || 'Invalid or expired QR code.', 'err'); return; }
  pendingToken = token;
  $('cf-title').textContent = d.action === 'clock_in' ? '⏱️ Clock In' : '⏱️ Clock Out';
  $('cf-site').textContent = d.site_name;
  $('cf-worker').textContent = workerName();
  $('cf-geo').textContent = 'Getting your location...';
  $('confirm-box').classList.remove('hidden');
  pendingGeo = null;
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => { pendingGeo = {lat: p.coords.latitude, lng: p.coords.longitude};
             $('cf-geo').textContent = '✓ Location captured'; },
      () => { $('cf-geo').textContent = 'Location unavailable — you can still continue.'; },
      {enableHighAccuracy: true, timeout: 10000});
  } else { $('cf-geo').textContent = 'Geolocation not supported.'; }
  window.scrollTo(0, 0);
}
function cancelConfirm(){
  pendingToken = null; pendingGeo = null;
  $('confirm-box').classList.add('hidden');
}

async function confirmClock(){
  if (!pendingToken || !curWorker) return;
  $('cf-confirm').disabled = true;
  const body = {token: pendingToken, worker_id: curWorker,
                lat: pendingGeo ? pendingGeo.lat : null,
                lng: pendingGeo ? pendingGeo.lng : null};
  const r = await fetch('/api/scan-clock', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  $('cf-confirm').disabled = false;
  cancelConfirm();
  if (d.ok) {
    msg(`✓ ${d.action === 'clock_in' ? 'Clocked in' : 'Clocked out'} at ${d.site_name}` +
        (d.hours ? ` — ${d.hours}h` : ''), 'ok');
  } else {
    msg(d.error || 'Clock action failed.', 'err');
  }
  refreshAll();
}

/* ---------- live location sharing ---------- */
$('loc-toggle').onchange = () => {
  if ($('loc-toggle').checked) startLocSharing();
  else stopLocSharing();
};
async function sendLocation(){
  if (!curWorker) return;
  const pos = await new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy}),
      () => res(null), {enableHighAccuracy: true, timeout: 10000});
  });
  if (!pos) { $('loc-hint').textContent = 'Location unavailable — retrying in a minute.'; return; }
  const r = await fetch('/api/location', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({worker_id: curWorker, lat: pos.lat, lng: pos.lng, accuracy: pos.accuracy})});
  const d = await r.json();
  if (d.ok) {
    $('loc-hint').textContent = 'Sharing live location (updates every minute).';
  } else {
    $('loc-hint').textContent = d.error || 'Sharing stopped.';
    $('loc-toggle').checked = false;
    stopLocSharing();
  }
}
function startLocSharing(){
  if (!curWorker) { $('loc-toggle').checked = false; return; }
  sendLocation();
  locTimer = setInterval(sendLocation, 60000);
}
function stopLocSharing(){
  $('loc-toggle').checked = false;
  if (locTimer) { clearInterval(locTimer); locTimer = null; }
  $('loc-hint').textContent = 'Sends your position every minute while clocked in.';
}

initWorker();
</script>
</body>
</html>
